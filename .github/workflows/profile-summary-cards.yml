name: GitHub Profile Summary Cards

on:
  schedule: # atualiza todo dia às 0h UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate
    steps:
      # 1️⃣ Checar o repositório
      - uses: actions/checkout@v3

      # 2️⃣ Configurar Git para commits
      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Gerar os cards usando seu token pessoal
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}  # token com escopos: repo, workflow, read:user, user:email
        with:
          USERNAME: bfabbio90

      # 4️⃣ Configurar o remote para push seguro
      - name: Configurar remote com token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/bfabbio90/bfabbio90.git

      # 5️⃣ Commit & Push das alterações
      - name: Commit & Push
        run: |
          git add .
          git commit -m "Atualizando GitHub Profile Summary Cards" || echo "Sem alterações para commitar"
          git push origin HEAD
